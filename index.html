<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHIVAM PPTX | Presentation Hub</title>

  <!-- Favicon Logo -->
  <link rel="icon" type="image/png" href="./icon.png" />
  <link rel="apple-touch-icon" href="./icon.png" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- JSZip for reading PPTX Slide 1 XML -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #030712;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(79, 70, 229, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(234, 179, 8, 0.08) 0%, transparent 40%);
      min-height: 100vh;
      color: #f3f4f6;
    }

    .glass-nav {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-card {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-card:hover {
      transform: translateY(-6px);
      border-color: rgba(234, 179, 8, 0.4);
      box-shadow: 0 20px 40px -15px rgba(234, 179, 8, 0.15);
    }

    .slide-preview-box {
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      background: #0f172a;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #030712; }
    ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
  </style>
</head>
<body class="p-4 sm:p-6 lg:p-10">

  <!-- Header -->
  <header class="max-w-6xl mx-auto mb-10">
    <div class="glass-nav rounded-3xl p-5 sm:p-6 flex flex-col sm:flex-row items-center justify-between gap-5 shadow-2xl">
      <div class="flex items-center gap-4">
        <div class="w-14 h-14 rounded-2xl overflow-hidden flex items-center justify-center shadow-lg border border-yellow-400/30 bg-[#0b1326] shrink-0">
          <img
            src="./icon.png"
            alt="Logo"
            class="w-full h-full object-cover"
            onerror="this.outerHTML = `<svg viewBox='0 0 100 100' class='w-full h-full'><rect width='100' height='100' fill='#0f172a'/><polygon points='50,25 20,75 80,75' fill='#eab308'/><circle cx='50' cy='35' r='8' fill='#00b4d8'/></svg>`"
          />
        </div>
        <div>
          <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight bg-gradient-to-r from-white via-yellow-100 to-amber-400 bg-clip-text text-transparent">
            SHIVAM PPTX
          </h1>
          <p class="text-xs sm:text-sm text-slate-400 font-medium">Auto-Sync Presentation Hub & Slide 1 Viewer</p>
        </div>
      </div>

      <!-- Status Pill -->
      <div class="bg-slate-900/80 border border-slate-800 px-4 py-2 rounded-2xl text-xs text-yellow-400 font-medium flex items-center gap-2.5">
        <span class="relative flex h-2.5 w-2.5">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-yellow-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-yellow-500"></span>
        </span>
        <span id="syncStatus">Auto-scanning root files...</span>
      </div>
    </div>
  </header>

  <!-- Search Bar -->
  <section class="max-w-3xl mx-auto mb-10 text-center">
    <div class="relative">
      <i data-lucide="search" class="w-5 h-5 text-slate-400 absolute left-5 top-1/2 -translate-y-1/2"></i>
      <input
        id="searchInput"
        type="text"
        placeholder="Search presentation (e.g. sst6.pptx, science1.pptx)..."
        class="w-full glass-nav rounded-2xl pl-13 pr-28 py-4 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-yellow-400/60 transition text-sm sm:text-base shadow-xl"
      />
      <button
        id="clearBtn"
        class="hidden absolute right-4 top-1/2 -translate-y-1/2 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3.5 py-2 rounded-xl transition font-medium"
      >
        Clear
      </button>
    </div>
  </section>

  <!-- Grid Content -->
  <main class="max-w-6xl mx-auto">
    <div class="flex items-center justify-between mb-5 px-1">
      <span id="resultCount" class="text-xs font-bold uppercase tracking-wider text-slate-400">Scanning Library...</span>
    </div>

    <!-- Presentation Cards Grid -->
    <div id="pptGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden glass-card rounded-3xl p-12 text-center max-w-md mx-auto my-12 shadow-2xl">
      <div class="w-16 h-16 rounded-2xl bg-yellow-500/10 text-yellow-400 flex items-center justify-center mx-auto mb-4 border border-yellow-500/20">
        <i data-lucide="file-question" class="w-8 h-8"></i>
      </div>
      <h3 class="text-lg font-bold text-white mb-2">No Matching Presentations Found</h3>
      <p class="text-sm text-slate-400">
        Make sure files like <span class="text-yellow-400 font-mono">sst6.pptx</span> or <span class="text-yellow-400 font-mono">science1.pptx</span> are uploaded in your repo root.
      </p>
    </div>
  </main>

  <script>
    let presentationData = [];

    const pptGrid = document.getElementById('pptGrid');
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');
    const emptyState = document.getElementById('emptyState');
    const resultCount = document.getElementById('resultCount');
    const syncStatus = document.getElementById('syncStatus');

    // Automatically generate potential filenames list (sst6 to sst20 & science1 to science15)
    function generateFileList() {
      const list = [];
      
      // sst6.pptx to sst20.pptx
      for (let i = 6; i <= 20; i++) {
        list.push(`sst${i}.pptx`);
      }
      
      // science1.pptx to science15.pptx
      for (let i = 1; i <= 15; i++) {
        list.push(`science${i}.pptx`);
      }
      
      return list;
    }

    // Auto-scan and verify which files actually exist in the root folder
    async function initAutoSync() {
      const possibleFiles = generateFileList();
      presentationData = [];
      pptGrid.innerHTML = '';
      
      let foundCount = 0;
      syncStatus.textContent = 'Checking root files...';

      // Check files concurrently for maximum speed (optimized for slow networks)
      await Promise.all(possibleFiles.map(async (filename) => {
        try {
          const response = await fetch(`./${filename}`, { method: 'HEAD' });
          if (response.ok) {
            // File exists, now fetch full blob and parse Slide 1
            const fullRes = await fetch(`./${filename}`);
            const blob = await fullRes.blob();
            const fileSize = (blob.size / (1024 * 1024)).toFixed(2) + ' MB';

            let title = filename.replace(/\.[^/.]+$/, '').replace(/([a-zA-Z]+)(\d+)/, '$1 $2').toUpperCase();
            let subtitle = 'Slide 1 Loaded • Ready for Download';
            let thumbnailBlobUrl = null;

            const zip = await JSZip.loadAsync(blob);
            
            const thumb = zip.file('docProps/thumbnail.jpeg') || zip.file('docProps/thumbnail.png');
            if (thumb) {
              const tBlob = await thumb.async('blob');
              thumbnailBlobUrl = URL.createObjectURL(tBlob);
            }

            const slide1 = zip.file('ppt/slides/slide1.xml');
            if (slide1) {
              const xmlText = await slide1.async('string');
              const words = [...xmlText.matchAll(/<a:t>([^<]+)<\/a:t>/g)]
                .map(m => m[1].trim())
                .filter(Boolean);

              if (words.length > 0) {
                title = words[0];
                subtitle = words.slice(1, 5).join(' • ') || 'First Page Content Extracted';
              }
            }

            presentationData.push({
              filename,
              title,
              subtitle,
              fileSize,
              thumbnailBlobUrl,
              fileUrl: `./${filename}`
            });
            foundCount++;
          }
        } catch (err) {
          // Ignore files that don't exist
        }
      }));

      // Sort presentation list nicely by name
      presentationData.sort((a, b) => a.filename.localeCompare(b.filename, undefined, { numeric: true }));

      syncStatus.textContent = `${foundCount} Presentations Synced`;
      renderCards(searchInput.value);
    }

    // Canvas generator for First Page Preview
    function generateCanvasPreview(item) {
      const canvas = document.createElement('canvas');
      canvas.width = 640;
      canvas.height = 360;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 640, 360);
      grad.addColorStop(0, '#312e81');
      grad.addColorStop(1, '#1e1b4b');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 640, 360);

      ctx.fillStyle = 'rgba(15, 23, 42, 0.6)';
      ctx.fillRect(30, 30, 580, 300);

      ctx.fillStyle = '#facc15';
      ctx.font = 'bold 12px "Plus Jakarta Sans", sans-serif';
      ctx.fillText(`FIRST PAGE (SLIDE 1) • ${item.filename.toUpperCase()}`, 54, 70);

      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(54, 84, 70, 4);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 26px "Plus Jakarta Sans", sans-serif';
      wrapText(ctx, item.title, 54, 135, 520, 36);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '15px "Plus Jakarta Sans", sans-serif';
      wrapText(ctx, item.subtitle, 54, 215, 520, 24);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.font = '11px "Plus Jakarta Sans", sans-serif';
      ctx.fillText('SHIVAM PPTX Hub', 54, 300);

      return canvas.toDataURL('image/png');
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      let count = 0;
      for (let i = 0; i < words.length; i++) {
        const testLine = line + words[i] + ' ';
        if (ctx.measureText(testLine).width > maxWidth && i > 0) {
          ctx.fillText(line, x, y);
          line = words[i] + ' ';
          y += lineHeight;
          count++;
          if (count >= 2) break;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, y);
    }

    // Render Cards
    function renderCards(filterText = '') {
      const query = filterText.trim().toLowerCase();
      pptGrid.innerHTML = '';

      const filtered = presentationData.filter(item =>
        item.filename.toLowerCase().includes(query) ||
        item.title.toLowerCase().includes(query) ||
        item.subtitle.toLowerCase().includes(query)
      );

      resultCount.textContent = `Showing ${filtered.length} Presentation${filtered.length === 1 ? '' : 's'}`;

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      filtered.forEach(item => {
        const previewSrc = item.thumbnailBlobUrl || generateCanvasPreview(item);
        const card = document.createElement('div');
        card.className = 'glass-card rounded-3xl overflow-hidden flex flex-col justify-between shadow-xl';

        card.innerHTML = `
          <div>
            <div class="slide-preview-box relative group">
              <img src="${previewSrc}" alt="${item.filename} Slide 1" class="w-full h-full object-cover transition duration-500 group-hover:scale-105" />
              <div class="absolute top-3 left-3 bg-slate-950/80 backdrop-blur-md text-[10px] font-bold px-2.5 py-1 rounded-xl text-yellow-400 border border-white/10 tracking-wider">
                SLIDE 1 PREVIEW
              </div>
              <div class="absolute bottom-3 right-3 bg-slate-950/80 backdrop-blur-md text-[11px] px-2.5 py-1 rounded-xl text-slate-300 font-mono">
                ${item.fileSize}
              </div>
            </div>

            <div class="p-5 sm:p-6">
              <div class="flex items-center justify-between text-xs font-mono text-yellow-400 mb-2">
                <span class="flex items-center gap-1.5 truncate">
                  <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
                  ${item.filename}
                </span>
                <span class="text-emerald-400 text-[11px]">● Live Sync</span>
              </div>
              <h2 class="text-base sm:text-lg font-bold text-white leading-snug mb-1.5 line-clamp-1">${item.title}</h2>
              <p class="text-xs text-slate-400 line-clamp-2 leading-relaxed">${item.subtitle}</p>
            </div>
          </div>

          <div class="px-5 pb-5 sm:px-6 sm:pb-6 pt-0">
            <a
              href="${item.fileUrl}"
              download="${item.filename}"
              class="w-full bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-slate-950 font-bold text-sm py-3 px-4 rounded-2xl flex items-center justify-center gap-2 shadow-lg shadow-yellow-500/20 transition active:scale-95"
            >
              <i data-lucide="download" class="w-4 h-4"></i>
              <span>Download File</span>
            </a>
          </div>
        `;

        pptGrid.appendChild(card);
      });

      lucide.createIcons();
    }

    searchInput.addEventListener('input', (e) => {
      const val = e.target.value;
      clearBtn.classList.toggle('hidden', val.length === 0);
      renderCards(val);
    });

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      clearBtn.classList.add('hidden');
      renderCards('');
    });

    lucide.createIcons();
    initAutoSync();
  </script>
</body>
</html>
